version: 2

unit_tests:
  - name: playlist_free_text_is_cleaned_and_identity_hashed
    model: stg_app__playlists
    given:
      # SQL fixture: the real table has an enum column dbt cannot fake with dict rows.
      - input: source('app', 'playlists')
        format: sql
        rows: |
          select '11111111-1111-1111-1111-111111111111'::uuid as id, 'u1' as owner_id, '  UPBEAT ' as mood,
                 'Road   Trip' as intent, 60 as target_length_min, 'someone' as source_profile_id,
                 null::text as spotify_playlist_id, 'draft' as status, false as is_favorite,
                 now() as created_at, now() as updated_at
          union all
          select '22222222-2222-2222-2222-222222222222'::uuid, 'u1', '   ', null, 30, 'someone',
                 'abc', 'approved', true, now(), now()
    expect:
      rows:
        - {playlist_id: "11111111-1111-1111-1111-111111111111", mood: "upbeat", intent: "road trip", is_exported: false}
        - {playlist_id: "22222222-2222-2222-2222-222222222222", mood: "unknown", intent: "unknown", is_exported: true}

  - name: taste_signal_share_and_rank
    model: fact_taste_signal
    given:
      - input: ref('fact_playlist_track')
        rows:
          - {source_playlist_id: "p1", position: 0, source_profile_key: "k", track_key: "a"}
          - {source_playlist_id: "p2", position: 0, source_profile_key: "k", track_key: "a"}
          - {source_playlist_id: "p1", position: 1, source_profile_key: "k", track_key: "b"}
    expect:
      rows:
        - {source_profile_key: "k", track_key: "a", playlist_appearances: 2, share: 0.6667, taste_rank: 1}
        - {source_profile_key: "k", track_key: "b", playlist_appearances: 1, share: 0.3333, taste_rank: 2}
