name: tastepipe_gold
version: "0.1.0"
config-version: 2
profile: tastepipe

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  tastepipe_gold:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold

snapshots:
  tastepipe_gold:
    +target_schema: gold
