[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tastepipe"
version = "0.1.0"
description = "Ingestion and validation pipeline for the Spotify taste-profile playlist builder"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
