name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tastepipe
          POSTGRES_PASSWORD: tastepipe
          POSTGRES_DB: tastepipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tastepipe" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://tastepipe:tastepipe@localhost:5432/tastepipe
      APP_DATABASE_URL: postgresql://tastepipe_app:tastepipe_app@localhost:5432/tastepipe
      PGPASSWORD: tastepipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply schema
        run: psql -h localhost -U tastepipe -d tastepipe -v ON_ERROR_STOP=1 -f db/init/001_schema.sql
      - name: Install
        working-directory: pipeline
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: pipeline
        run: ruff check .
      - name: Test
        working-directory: pipeline
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: ci-build-only
          APP_DATABASE_URL: postgresql://unused
