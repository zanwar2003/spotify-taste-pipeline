services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tastepipe
      POSTGRES_PASSWORD: tastepipe
      POSTGRES_DB: tastepipe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastepipe -d tastepipe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
